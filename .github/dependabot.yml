version: 2

# Re-validated 2026-11-15 (third pass, after #21): the pinned coding-client rev still declared
# the umbrella pydantic-ai, whose google/bedrock extras brought google-genai and
# boto3>=1.44 — the unresolvable pair. The rev now points at coding-client's slim-provider
# release and this service is on pydantic-ai 2.68. This touch makes GitHub recompute the job.

# Re-validated 2026-11-15 (second pass, after #19): the umbrella pydantic-ai pulled the
# bedrock extra's boto3 floor and requires-python was unbounded, both fixed. GitHub only
# recomputes a Dependabot update job on a dependabot.yml change or its weekly schedule, so
# this touch is what puts a current verdict on the record.

# Dependabot replaces the org's private Renovate preset: a public repository cannot inherit a
# preset hosted in a private one.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: ty
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
